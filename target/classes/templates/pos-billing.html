<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head}"></head>
<body>
    <div th:replace="~{fragments/header :: sidebar}"></div>
    
    <div class="main-content pos-container container-fluid p-3">
        <div class="row h-100">
            
            <!-- LEFT PANEL: Product Catalogue -->
            <div class="col-lg-4 h-100 d-flex flex-column">
                <div class="mb-3">
                    <div class="input-group">
                        <span class="input-group-text bg-dark text-white border-secondary"><i class="bi bi-upc-scan"></i></span>
                        <input type="text" id="barcodeInput" class="form-control" placeholder="Scan or enter barcode..." autofocus>
                    </div>
                </div>
                <div class="mb-3">
                    <div class="input-group">
                        <span class="input-group-text bg-dark text-white border-secondary"><i class="bi bi-search"></i></span>
                        <input type="text" id="productSearch" class="form-control" placeholder="Search products...">
                    </div>
                </div>
                <div class="product-grid flex-grow-1" id="productGrid">
                    <div class="product-card" th:each="prod : ${products}" th:onclick="'showProductVariants(' + ${prod.id} + ')'">
                        <img th:src="${prod.imageUrl != null ? prod.imageUrl : '/images/placeholder.jpg'}" alt="Product" onerror="this.src='data:image/svg+xml;charset=UTF-8,%3Csvg%20width%3D%22200%22%20height%3D%22200%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20200%20200%22%20preserveAspectRatio%3D%22none%22%3E%3Cdefs%3E%3Cstyle%20type%3D%22text%2Fcss%22%3E%23holder_18a28e83b0a%20text%20%7B%20fill%3A%23999%3Bfont-weight%3Anormal%3Bfont-family%3Avar(--bs-font-sans-serif)%2C%20sans-serif%3Bfont-size%3A10pt%20%7D%20%3C%2Fstyle%3E%3C%2Fdefs%3E%3Cg%20id%3D%22holder_18a28e83b0a%22%3E%3Crect%20width%3D%22200%22%20height%3D%22200%22%20fill%3D%22%23373940%22%3E%3C%2Frect%3E%3Cg%3E%3Ctext%20x%3D%2274.421875%22%20y%3D%22104.5%22%3ENo%20Image%3C%2Ftext%3E%3C%2Fg%3E%3C%2Fg%3E%3C%2Fsvg%3E'">
                        <div class="w-100 text-center">
                            <div class="fw-bold text-truncate" th:text="${prod.name}">Name</div>
                            <small class="text-muted text-truncate d-block" th:text="${prod.brand}">Brand</small>
                        </div>
                        <div class="price-badge" th:if="${!#lists.isEmpty(prod.variants)}" th:text="${'₹' + prod.variants[0].sellingPrice}">₹0</div>
                    </div>
                </div>
            </div>
            <!-- CENTER PANEL: Active Cart -->
            <div class="col-lg-5 h-100 d-flex flex-column">
                <div class="card bg-dark border-secondary mb-3">
                    <div class="card-body p-2">
                        <div class="row g-2">
                            <div class="col-md-6">
                                <div class="input-group input-group-sm">
                                    <span class="input-group-text bg-secondary text-white border-secondary"><i class="bi bi-phone"></i></span>
                                    <input type="text" id="customerPhone" class="form-control" placeholder="Customer Phone" onblur="CartManager.lookupCustomer(this.value)">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="input-group input-group-sm">
                                    <span class="input-group-text bg-secondary text-white border-secondary"><i class="bi bi-person"></i></span>
                                    <input type="text" id="customerName" class="form-control" placeholder="Customer Name" onchange="CartManager.customerName = this.value">
                                </div>
                            </div>
                        </div>
                        <div id="customerInfo" class="d-none mt-2 small text-info">
                            <i class="bi bi-star-fill text-warning"></i> Points: <span id="customerLoyalty">0</span> | 
                            <i class="bi bi-wallet2"></i> Credit: <span id="customerCredit">₹0</span>
                        </div>
                    </div>
                </div>
                
                <div class="cart-table-container flex-grow-1 position-relative">
                    <table class="table table-sm table-borderless table-hover">
                        <thead class="border-bottom border-secondary sticky-top bg-dark">
                            <tr>
                                <th>Item</th>
                                <th>Size</th>
                                <th>Color</th>
                                <th>Qty</th>
                                <th>Price</th>
                                <th>Tax</th>
                                <th>Total</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="cartTableBody">
                            <!-- JS injected rows -->
                        </tbody>
                    </table>
                    <div id="emptyCartMsg" class="position-absolute top-50 start-50 translate-middle text-center text-muted">
                        <i class="bi bi-cart-x fs-1"></i>
                        <p>Cart is empty</p>
                    </div>
                </div>
                
                <div class="mt-3">
                    <div class="input-group input-group-sm">
                        <span class="input-group-text bg-dark text-white border-secondary">Discount ₹</span>
                        <input type="number" id="discountInput" class="form-control" value="0" min="0" onchange="CartManager.setDiscount(this.value)">
                    </div>
                </div>
            </div>
            
            <!-- RIGHT PANEL: Checkout Summary -->
            <div class="col-lg-3 h-100">
                <div class="checkout-panel d-flex flex-column h-100">
                    <h5 class="text-center mb-4 border-bottom pb-2 border-secondary">Order Summary</h5>
                    
                    <div class="d-flex justify-content-between mb-2">
                        <span>Items</span>
                        <strong id="itemCountDisplay">0 items</strong>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span>Subtotal</span>
                        <span id="subtotalDisplay">₹0.00</span>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span>Taxable</span>
                        <span id="taxableDisplay">₹0.00</span>
                    </div>
                    <div class="d-flex justify-content-between mb-1 text-muted small">
                        <span>CGST</span>
                        <span id="cgstDisplay">₹0.00</span>
                    </div>
                    <div class="d-flex justify-content-between mb-3 text-muted small">
                        <span>SGST</span>
                        <span id="sgstDisplay">₹0.00</span>
                    </div>
                    
                    <hr>
                    
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h4 class="mb-0">Total</h4>
                        <div class="total-display" id="grandTotalDisplay">₹0.00</div>
                    </div>
                    
                    <div class="mt-auto">
                        <button class="payment-btn cash w-100" onclick="CartManager.checkout('CASH')">
                            <i class="bi bi-cash-stack me-2"></i> Cash
                        </button>
                        <button class="payment-btn upi w-100" onclick="CartManager.checkout('UPI')">
                            <i class="bi bi-qr-code-scan me-2"></i> UPI
                        </button>
                        <button class="payment-btn card w-100" onclick="CartManager.checkout('CARD')">
                            <i class="bi bi-credit-card me-2"></i> Card
                        </button>
                        
                        <button class="btn btn-outline-danger w-100 mt-2" onclick="CartManager.clearCart()">
                            <i class="bi bi-trash"></i> Clear Cart
                        </button>
                    </div>
                </div>
            </div>
            
        </div>
    </div>
    
    <!-- Product Variants Modal -->
    <div class="modal fade" id="variantsModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="variantsModalTitle">Product Name</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <!-- Left Side: Product Images Carousel -->
                        <div class="col-md-5 mb-3">
                            <div id="productImagesCarousel" class="carousel slide" data-bs-ride="carousel">
                                <div class="carousel-inner" id="carouselInnerContainer" style="border-radius: 8px; border: 1px solid #e2e8f0; background: #f8fafc;">
                                    <!-- Images injected via JS -->
                                </div>
                                <button class="carousel-control-prev" type="button" data-bs-target="#productImagesCarousel" data-bs-slide="prev">
                                    <span class="carousel-control-prev-icon bg-dark rounded-circle" aria-hidden="true"></span>
                                    <span class="visually-hidden">Previous</span>
                                </button>
                                <button class="carousel-control-next" type="button" data-bs-target="#productImagesCarousel" data-bs-slide="next">
                                    <span class="carousel-control-next-icon bg-dark rounded-circle" aria-hidden="true"></span>
                                    <span class="visually-hidden">Next</span>
                                </button>
                            </div>
                        </div>
                        <!-- Right Side: Size Matrix -->
                        <div class="col-md-7">
                            <div id="variantsMatrixContainer" class="table-responsive">
                                <!-- Matrix injected via JS -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Invoice Success Modal -->
    <div class="modal fade" id="invoiceSuccessModal" tabindex="-1" data-bs-backdrop="static">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title"><i class="bi bi-check-circle-fill"></i> Payment Successful</h5>
                </div>
                <div class="modal-body text-center">
                    <h2 class="text-success mb-3" id="modalGrandTotal">₹0.00</h2>
                    <p class="lead mb-1">Invoice: <strong id="modalInvoiceNumber">INV-000</strong></p>
                    <p class="text-muted mb-1">Customer: <span id="modalCustomerName">Walk-in</span></p>
                    <p class="text-muted mb-3">Paid via <span id="modalPaymentMode" class="badge bg-secondary">CASH</span></p>
                    <input type="hidden" id="modalInvoiceId">
                    
                    <div class="d-grid gap-2">
                        <button class="btn btn-primary btn-lg" onclick="window.open('/invoice/' + document.getElementById('modalInvoiceId').value, '_blank')">
                            <i class="bi bi-printer"></i> Print Receipt
                        </button>
                        <button class="btn btn-whatsapp btn-lg" onclick="sendLastInvoiceWhatsApp()">
                            <i class="bi bi-whatsapp"></i> Send on WhatsApp
                        </button>
                        <button class="btn btn-outline-secondary mt-2" data-bs-dismiss="modal">
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: scripts}"></div>
    
    <script th:inline="javascript">
        /*<![CDATA[*/
        const productsData = /*[[${products}]]*/ [];
        
        function showProductVariants(productId) {
            const product = productsData.find(p => p.id === productId);
            if (!product) return;
            
            document.getElementById('variantsModalTitle').textContent = product.name;

            // Populate Carousel Images
            const carouselInner = document.getElementById('carouselInnerContainer');
            carouselInner.innerHTML = '';
            
            let imageUrls = product.imageUrls || [];
            if (imageUrls.length === 0 && product.imageUrl) {
                imageUrls = [product.imageUrl];
            }
            
            if (imageUrls.length === 0) {
                const activeDiv = document.createElement('div');
                activeDiv.className = 'carousel-item active';
                activeDiv.innerHTML = `<div class="d-flex justify-content-center align-items-center text-muted" style="height: 250px;">
                                            <i class="bi bi-image" style="font-size: 3rem;"></i>
                                       </div>`;
                carouselInner.appendChild(activeDiv);
            } else {
                imageUrls.forEach((url, index) => {
                    const div = document.createElement('div');
                    div.className = `carousel-item ${index === 0 ? 'active' : ''}`;
                    div.innerHTML = `<img src="${url}" class="d-block w-100" style="height: 250px; object-fit: cover;" alt="Product image">`;
                    carouselInner.appendChild(div);
                });
            }
            
            const prevBtn = document.querySelector('#productImagesCarousel .carousel-control-prev');
            const nextBtn = document.querySelector('#productImagesCarousel .carousel-control-next');
            if (imageUrls.length <= 1) {
                if (prevBtn) prevBtn.style.display = 'none';
                if (nextBtn) nextBtn.style.display = 'none';
            } else {
                if (prevBtn) prevBtn.style.display = 'block';
                if (nextBtn) nextBtn.style.display = 'block';
            }
            
            const variants = product.variants;
            if (!variants || variants.length === 0) {
                document.getElementById('variantsMatrixContainer').innerHTML = '<p class="text-center text-muted">No variants available</p>';
                new bootstrap.Modal(document.getElementById('variantsModal')).show();
                return;
            }
            
            // Extract unique sizes and colors
            const sizes = [...new Set(variants.map(v => v.size))].sort();
            const colors = [...new Set(variants.map(v => v.color))].sort();
            
            let html = '<table class="size-matrix">';
            html += '<tr><th>Color \\ Size</th>';
            sizes.forEach(s => html += `<th>${s}</th>`);
            html += '</tr>';
            
            colors.forEach(c => {
                html += `<tr><th style="cursor: pointer; text-decoration: underline;" onclick="previewColorVariant('${c}', ${productId})" title="Click to preview color image">${c}</th>`;
                sizes.forEach(s => {
                    const variant = variants.find(v => v.size === s && v.color === c);
                    if (variant) {
                        let stockClass = 'stock-in';
                        if (variant.stockQuantity === 0) stockClass = 'stock-out';
                        else if (variant.stockQuantity <= 3) stockClass = 'stock-low';
                        
                        const clickHandler = variant.stockQuantity > 0 ? `onclick="addVariantFromMatrix(${variant.id})"` : '';
                        
                        let hoverHandler = `onmouseover="previewColorVariant('${c}', ${productId})"`;
                        if (variant.imageUrls && variant.imageUrls.length > 0) {
                            const urlsJson = JSON.stringify(variant.imageUrls).replace(/"/g, '&quot;');
                            hoverHandler = `onmouseover="showVariantImagesPreview(${urlsJson})"`;
                        } else if (variant.imageUrl) {
                            hoverHandler = `onmouseover="showVariantImagesPreview(['${variant.imageUrl}'])"`;
                        }
                        
                        html += `<td class="size-cell ${stockClass}" ${clickHandler} ${hoverHandler} title="Stock: ${variant.stockQuantity} (Hover to see image)">
                                    ${variant.stockQuantity}
                                 </td>`;
                    } else {
                        html += `<td style="background:rgba(255,255,255,0.05); color:#666">-</td>`;
                    }
                });
                html += '</tr>';
            });
            html += '</table>';
            
            document.getElementById('variantsMatrixContainer').innerHTML = html;
            
            const modal = new bootstrap.Modal(document.getElementById('variantsModal'));
            modal.show();
        }
        
        function showVariantImagesPreview(urls) {
            if (!urls || urls.length === 0) return;
            const carouselInner = document.getElementById('carouselInnerContainer');
            carouselInner.innerHTML = '';
            
            urls.forEach((url, index) => {
                const div = document.createElement('div');
                div.className = `carousel-item ${index === 0 ? 'active' : ''}`;
                div.innerHTML = `<img src="${url}" class="d-block w-100" style="height: 250px; object-fit: cover;" alt="Variant preview">`;
                carouselInner.appendChild(div);
            });
            
            const prevBtn = document.querySelector('#productImagesCarousel .carousel-control-prev');
            const nextBtn = document.querySelector('#productImagesCarousel .carousel-control-next');
            if (urls.length <= 1) {
                if (prevBtn) prevBtn.style.display = 'none';
                if (nextBtn) nextBtn.style.display = 'none';
            } else {
                if (prevBtn) prevBtn.style.display = 'block';
                if (nextBtn) nextBtn.style.display = 'block';
            }
        }
        
        function previewColorVariant(color, productId) {
            const product = productsData.find(p => p.id === productId);
            if (!product) return;
            
            const match = product.variants.find(v => v.color === color && ((v.imageUrls && v.imageUrls.length > 0) || v.imageUrl));
            if (match) {
                if (match.imageUrls && match.imageUrls.length > 0) {
                    showVariantImagesPreview(match.imageUrls);
                } else {
                    showVariantImagesPreview([match.imageUrl]);
                }
            }
        }
        
        function addVariantFromMatrix(variantId) {
            // Find variant
            let variant = null;
            let product = null;
            for (let p of productsData) {
                const v = p.variants.find(v => v.id === variantId);
                if (v) {
                    variant = v;
                    product = p;
                    break;
                }
            }
            
            if (variant && product) {
                const scanResult = {
                    variantId: variant.id,
                    productName: product.name,
                    brand: product.brand,
                    size: variant.size,
                    color: variant.color,
                    barcode: variant.barcode,
                    sellingPrice: variant.sellingPrice,
                    gstRate: product.gstRate,
                    stockQuantity: variant.stockQuantity
                };
                CartManager.addItem(scanResult);
                showToast(`Added ${product.name} (${variant.size}/${variant.color})`, 'success');
            }
        }
        
        // Handle barcode input explicitly
        document.getElementById('barcodeInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const barcode = this.value.trim();
                if (barcode) {
                    BarcodeScanner.processScan(barcode);
                    this.value = '';
                }
            }
        });
        /*]]>*/
    </script>
</body>
</html>
