<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head}"></head>
<body>
    <div th:replace="~{fragments/header :: sidebar}"></div>
    
    <div class="main-content customers-page">
        <div class="section-toolbar">
            <div><p class="section-kicker">CUSTOMER RELATIONSHIP</p><p class="section-description">Manage customer profiles, loyalty points and store credit.</p></div>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addCustomerModal">
                <i class="bi bi-person-plus"></i> Add Customer
            </button>
        </div>
        
        <div class="card customer-directory-card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Customer Directory</h5>
                <div class="input-group directory-search">
                    <span class="input-group-text"><i class="bi bi-search"></i></span>
                    <input type="text" class="form-control" placeholder="Search by name or phone...">
                </div>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Phone</th>
                                <th>Loyalty Points</th>
                                <th>Credit Balance</th>
                                <th>Member Since</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="customer : ${customers}">
                                <td>
                                    <strong th:text="${customer.fullName}">John Doe</strong>
                                </td>
                                <td>
                                    <i class="bi bi-telephone text-muted me-2"></i>
                                    <span th:text="${customer.phoneNumber}">9876543210</span>
                                </td>
                                <td>
                                    <span class="badge bg-warning text-dark rounded-pill px-3" th:text="${customer.loyaltyPoints}">0</span>
                                </td>
                                <td>
                                    <span class="text-danger" th:if="${customer.creditBalance > 0}" th:text="${'₹' + customer.creditBalance}">₹0</span>
                                    <span class="text-success" th:if="${customer.creditBalance <= 0}">₹0</span>
                                </td>
                                <td th:text="${#temporals.format(customer.createdAt, 'dd MMM yyyy')}">01 Jan 2024</td>
                                <td>
                                    <a th:href="@{'/customers/' + ${customer.id}}" class="btn btn-sm btn-outline-info me-1">
                                        <i class="bi bi-eye"></i> View
                                    </a>
                                    <form th:action="@{/customers/delete/{id}(id=${customer.id})}" method="post" class="d-inline" onsubmit="return confirm('Delete this customer?');">
                                        <button type="submit" class="btn btn-sm btn-outline-danger">
                                            <i class="bi bi-trash"></i> Delete
                                        </button>
                                    </form>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(customers)}">
                                <td colspan="6" class="text-center py-4">No customers found.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Add Customer Modal -->
    <div class="modal fade" id="addCustomerModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content bg-dark text-white border-secondary">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title">Add New Customer</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form th:action="@{/customers}" method="post">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" name="fullName" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Phone Number</label>
                            <input type="tel" name="phoneNumber" class="form-control" required pattern="[0-9]{10}" title="10 digit mobile number">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Initial Credit Balance (Optional)</label>
                            <input type="number" step="0.01" name="creditBalance" class="form-control" value="0.00">
                        </div>
                    </div>
                    <div class="modal-footer border-secondary">
                        <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save Customer</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
