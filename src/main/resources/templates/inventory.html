<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head}"></head>
<body>
    <div th:replace="~{fragments/header :: sidebar}"></div>
    
    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Inventory Management</h2>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addProductModal">
                <i class="bi bi-plus-lg"></i> Add Product
            </button>
        </div>
        
        <div class="accordion" id="inventoryAccordion">
            <div class="accordion-item bg-dark text-white border-secondary mb-2" th:each="prod, iterStat : ${products}">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed bg-dark text-white" type="button" data-bs-toggle="collapse" th:data-bs-target="'#collapse' + ${prod.id}">
                        <div class="d-flex w-100 justify-content-between align-items-center me-3">
                            <strong th:text="${prod.name}">Product Name</strong>
                            <span class="badge bg-secondary" th:text="${prod.brand}">Brand</span>
                            <span class="badge bg-info text-dark" th:text="${prod.variants.size() + ' Variants'}">0 Variants</span>
                        </div>
                    </button>
                </h2>
                <div th:id="'collapse' + ${prod.id}" class="accordion-collapse collapse" data-bs-parent="#inventoryAccordion">
                    <div class="accordion-body">
                        <div class="row mb-3 text-muted small">
                            <div class="col-md-3"><strong>HSN:</strong> <span th:text="${prod.hsnCode}"></span></div>
                            <div class="col-md-3"><strong>GST:</strong> <span th:text="${prod.gstRate + '%'}"></span></div>
                            <div class="col-md-3"><strong>Category:</strong> <span th:text="${prod.category}"></span></div>
                            <div class="col-md-6 text-end">
                                <button class="btn btn-sm btn-outline-light" th:onclick="'openAddVariantModal(' + ${prod.id} + ')'">
                                    <i class="bi bi-plus"></i> Add Variant
                                </button>
                                <form th:action="@{/inventory/product/delete/{id}(id=${prod.id})}" method="post" class="d-inline" onsubmit="return confirm('Delete this product and all its variants?');">
                                    <button type="submit" class="btn btn-sm btn-outline-danger ms-2">
                                        <i class="bi bi-trash"></i> Delete Product
                                    </button>
                                </form>
                            </div>
                        </div>
                        
                        <div class="table-responsive">
                            <table class="table table-dark table-sm table-striped">
                                <thead>
                                    <tr>
                                        <th>Barcode</th>
                                        <th>Size</th>
                                        <th>Color</th>
                                        <th>Price</th>
                                        <th>Stock</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="var : ${prod.variants}">
                                        <td th:text="${var.barcode}">UK001</td>
                                        <td><span class="badge bg-info" th:text="${var.size}">M</span></td>
                                        <td><span class="badge bg-secondary" th:text="${var.color}">Red</span></td>
                                        <td th:text="${'₹' + var.sellingPrice}">₹0</td>
                                        <td>
                                            <span class="badge" th:classappend="${var.stockQuantity > 5 ? 'bg-success' : (var.stockQuantity > 0 ? 'bg-warning' : 'bg-danger')}" th:text="${var.stockQuantity}">10</span>
                                        </td>
                                        <td>
                                            <div class="d-flex align-items-center">
                                                <form th:action="@{/inventory/variant/{id}/stock(id=${var.id})}" method="post" class="d-flex align-items-center me-2" style="max-width: 140px;">
                                                    <input type="number" name="quantity" class="form-control form-control-sm me-2 bg-dark text-white border-secondary" required placeholder="Add Qty">
                                                    <button type="submit" class="btn btn-sm btn-success"><i class="bi bi-check2"></i></button>
                                                </form>
                                                <button type="button" class="btn btn-sm btn-outline-warning edit-variant-btn me-2" 
                                                </button>
                                                <form th:action="@{/inventory/variant/delete/{id}(id=${var.id})}" method="post" class="d-inline" onsubmit="return confirm('Delete this variant?');">
                                                    <button type="submit" class="btn btn-sm btn-outline-danger">
                                                        <i class="bi bi-trash"></i>
                                                    </button>
                                                </form>
                                            </div>
                                        </td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(prod.variants)}">
                                        <td colspan="6" class="text-center">No variants found.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Add Product Modal -->
    <div class="modal fade" id="addProductModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content bg-dark text-white border-secondary">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title">Add New Product</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form th:action="@{/inventory/product}" method="post" enctype="multipart/form-data">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">Product Name</label>
                            <input type="text" name="name" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Product Images (Attach 5+ photos)</label>
                            <input type="file" name="images" class="form-control bg-light text-dark" multiple accept="image/*">
                            <small class="text-muted">Select multiple files at once to upload.</small>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Brand</label>
                                <input type="text" name="brand" class="form-control">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Category</label>
                                <input type="text" name="category" class="form-control">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">HSN Code</label>
                                <input type="text" name="hsnCode" class="form-control">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">GST Rate (%)</label>
                                <select name="gstRate" class="form-select">
                                    <option value="0">0%</option>
                                    <option value="5">5%</option>
                                    <option value="12">12%</option>
                                    <option value="18">18%</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer border-secondary">
                        <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save Product</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Add Variant Modal -->
    <div class="modal fade" id="addVariantModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content bg-dark text-white border-secondary">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title" id="variantModalTitle">Add Product Variant</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form th:action="@{/inventory/variant}" method="post" enctype="multipart/form-data">
                    <input type="hidden" name="productId" id="variantProductId">
                    <input type="hidden" name="id" id="variantId">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label" id="variantImageLabel">Variant Images (Attach 5+ photos)</label>
                            <input type="file" name="imageFiles" class="form-control bg-light text-dark" multiple accept="image/*">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Barcode</label>
                            <input type="text" name="barcode" id="variantBarcode" class="form-control" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Size</label>
                                <input type="text" name="size" id="variantSize" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Color</label>
                                <input type="text" name="color" id="variantColor" class="form-control" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Cost Price</label>
                                <input type="number" step="0.01" name="costPrice" id="variantCostPrice" class="form-control">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Selling Price</label>
                                <input type="number" step="0.01" name="sellingPrice" id="variantSellingPrice" class="form-control" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label" id="variantStockLabel">Initial Stock</label>
                                <input type="number" name="stockQuantity" id="variantStockQuantity" class="form-control" value="0">
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer border-secondary">
                        <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save Variant</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: scripts}"></div>
    <script>
        document.addEventListener('click', function(e) {
            document.getElementById('variantProductId').value = productId;
            document.getElementById('variantId').value = '';
            document.getElementById('variantModalTitle').textContent = 'Add Product Variant';
            document.getElementById('variantStockLabel').textContent = 'Initial Stock';
            
            // Clear inputs
            document.getElementById('variantBarcode').value = '';
            document.getElementById('variantSize').value = '';
            document.getElementById('variantColor').value = '';
            document.getElementById('variantCostPrice').value = '';
            document.getElementById('variantSellingPrice').value = '';
            document.getElementById('variantStockQuantity').value = '0';
            
            new bootstrap.Modal(document.getElementById('addVariantModal')).show();
        }

        function openEditVariantModal(productId, variantId, barcode, size, color, costPrice, sellingPrice, stockQuantity) {
            document.getElementById('variantProductId').value = productId;
            document.getElementById('variantId').value = variantId;
            document.getElementById('variantModalTitle').textContent = 'Edit Product Variant';
            document.getElementById('variantStockLabel').textContent = 'Update Stock';
            
            // Set inputs
            document.getElementById('variantBarcode').value = barcode;
            document.getElementById('variantSize').value = size;
            document.getElementById('variantColor').value = color;
            document.getElementById('variantCostPrice').value = costPrice;
            document.getElementById('variantSellingPrice').value = sellingPrice;
            document.getElementById('variantStockQuantity').value = stockQuantity;
            
            new bootstrap.Modal(document.getElementById('addVariantModal')).show();
        }
    </script>
</body>
</html>
