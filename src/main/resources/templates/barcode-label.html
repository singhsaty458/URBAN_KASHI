<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head>
    <link rel="manifest" href="/manifest.json"><meta charset="UTF-8"><title>Product QR Label</title><style>@page{size:50mm 25mm;margin:0}body{margin:0;font-family:Arial,sans-serif}.label{width:50mm;height:25mm;box-sizing:border-box;padding:1.5mm;display:flex;gap:1.5mm;align-items:center;border:1px dashed #bbb}.details{min-width:0;flex:1;text-align:center}.brand{font-weight:800;font-size:8px;letter-spacing:.7px}.name{font-size:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1mm}.meta{font-size:7px;font-weight:700;margin-top:.5mm}.barcode{font-family:monospace;font-size:8px;letter-spacing:.5px;margin-top:1mm}.price{font-size:10px;font-weight:800;margin-top:.5mm}.qr-code{width:20mm;height:20mm;image-rendering:pixelated}@media print{button{display:none}.label{border:0}}</style></head><body><div class="label"><div class="details"><div class="brand">URBAN KASHI</div><div class="name" th:text="${variant.product.name}">Product</div><div class="meta" th:text="${variant.size+' · '+variant.color}">M · Blue</div><div class="barcode" th:text="${variant.barcode}">UK001</div><div class="price" th:text="${'₹'+variant.sellingPrice}">₹999</div></div><img class="qr-code" th:src="@{'data:image/png;base64,' + ${qrCode}}" alt="Scan to add this product to Billing/POS"></div><button onclick="window.print()">Print label</button></body></html>
