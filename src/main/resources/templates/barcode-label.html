<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Product Label</title><style>@page{size:50mm 25mm;margin:0}body{margin:0;font-family:Arial,sans-serif}.label{width:50mm;height:25mm;box-sizing:border-box;padding:2mm;text-align:center;border:1px dashed #bbb}.brand{font-weight:800;font-size:9px;letter-spacing:1px}.name{font-size:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:8px;font-weight:700}.barcode{font-family:monospace;font-size:11px;letter-spacing:1px;margin:2px}.price{font-size:10px;font-weight:800}@media print{button{display:none}.label{border:0}}</style></head><body><div class="label"><div class="brand">URBAN KASHI</div><div class="name" th:text="${variant.product.name}">Product</div><div class="meta" th:text="${variant.size+' · '+variant.color}">M · Blue</div><div class="barcode" th:text="${variant.barcode}">UK001</div><div class="price" th:text="${'₹'+variant.sellingPrice}">₹999</div></div><button onclick="window.print()">Print label</button></body></html>
