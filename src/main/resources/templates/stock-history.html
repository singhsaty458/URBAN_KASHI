<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/header :: head}"></head><body>
<div th:replace="~{fragments/header :: sidebar}"></div><main class="main-content operations-page">
 <div class="operations-toolbar"><form method="get" class="filter-form"><input type="date" name="from" th:value="${from}"><input type="date" name="to" th:value="${to}"><select name="type"><option value="">All movements</option><option th:each="item : ${types}" th:value="${item}" th:text="${item}" th:selected="${item == selectedType}">SALE</option></select><button class="btn btn-primary" type="submit"><i class="bi bi-funnel"></i> Filter</button></form><a class="btn btn-outline-success" href="/stock-history/export"><i class="bi bi-filetype-csv"></i> Export CSV</a></div>
 <section class="operations-card"><div class="panel-title"><div><h2>Stock movement history</h2><p>Every stock change with its source, user and resulting balance.</p></div></div><div class="table-responsive"><table class="table table-hover align-middle"><thead><tr><th>Date</th><th>Product / Variant</th><th>Type</th><th>Change</th><th>Stock after</th><th>Reference</th><th>Reason</th><th>User</th></tr></thead><tbody><tr th:each="movement : ${movements}"><td th:text="${#temporals.format(movement.createdAt, 'dd MMM yy, HH:mm')}">Date</td><td><strong th:text="${movement.variant.product.name}">Product</strong><small class="d-block text-muted" th:text="${movement.variant.size + ' · ' + movement.variant.color}">M · Black</small></td><td><span class="movement-badge" th:text="${movement.type}">SALE</span></td><td th:classappend="${movement.quantityChange > 0 ? 'text-success' : 'text-danger'}" th:text="${movement.quantityChange > 0 ? '+' + movement.quantityChange : movement.quantityChange}">-1</td><td th:text="${movement.quantityAfter}">10</td><td th:text="${movement.reference ?: '—'}">Invoice</td><td th:text="${movement.reason ?: '—'}">Reason</td><td th:text="${movement.performedBy}">admin</td></tr><tr th:if="${#lists.isEmpty(movements)}"><td colspan="8" class="text-center py-5 text-muted">No stock movements for the selected period.</td></tr></tbody></table></div></section>
</main><div th:replace="~{fragments/footer :: scripts}"></div></body></html>
