<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/header :: head}"></head><body>
<div th:replace="~{fragments/header :: sidebar}"></div><main class="main-content operations-page">
 <div class="operations-toolbar"><form method="get" class="filter-form"><input type="date" name="from" th:value="${from}"><input type="date" name="to" th:value="${to}"><button class="btn btn-primary" type="submit"><i class="bi bi-funnel"></i> Filter</button></form><a class="btn btn-outline-success" href="/audit-logs/export"><i class="bi bi-filetype-csv"></i> Export CSV</a></div>
 <section class="operations-card"><div class="panel-title"><div><h2>Audit log</h2><p>Administrator audit trail for financial and stock-sensitive actions.</p></div></div><div class="table-responsive"><table class="table table-hover align-middle"><thead><tr><th>Date</th><th>Action</th><th>Entity</th><th>Details</th><th>Performed by</th></tr></thead><tbody><tr th:each="log : ${logs}"><td th:text="${#temporals.format(log.createdAt, 'dd MMM yy, HH:mm')}">Date</td><td><span class="movement-badge" th:text="${log.action}">ACTION</span></td><td th:text="${log.entityType + (log.entityId != null ? ' #' + log.entityId : '')}">Entity</td><td th:text="${log.details ?: '—'}">Details</td><td th:text="${log.performedBy}">admin</td></tr><tr th:if="${#lists.isEmpty(logs)}"><td colspan="5" class="text-center py-5 text-muted">No audit records for the selected period.</td></tr></tbody></table></div></section>
</main><div th:replace="~{fragments/footer :: scripts}"></div></body></html>
