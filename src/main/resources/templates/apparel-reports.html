<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/header :: head}"></head><body><div th:replace="~{fragments/header :: sidebar}"></div><main class="main-content operations-page"><div class="section-toolbar"><div><p class="section-kicker">APPAREL INTELLIGENCE</p><p class="section-description">Broken size sets that can cause missed sales.</p></div></div><section class="operations-card"><div class="panel-title"><div><h2>Broken size detection</h2><p>Out-of-stock sizes surrounded by available sizes.</p></div></div><div class="table-responsive"><table class="table table-hover"><thead><tr><th>Product</th><th>Color</th><th>Missing size</th><th>Action</th></tr></thead><tbody><tr th:each="row:${brokenSizes}"><td th:text="${row.productName}">Shirt</td><td th:text="${row.color}">Blue</td><td><span class="badge bg-danger" th:text="${row.missingSize}">L</span></td><td><a class="btn btn-sm btn-outline-primary" th:href="@{/inventory/matrix/{id}(id=${row.productId})}">View matrix</a></td></tr><tr th:if="${#lists.isEmpty(brokenSizes)}"><td colspan="4" class="text-center py-5 text-muted">No broken size sets detected.</td></tr></tbody></table></div></section></main><div th:replace="~{fragments/footer :: scripts}"></div></body></html>
