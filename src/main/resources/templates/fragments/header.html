<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urban Kashi POS</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom POS Style -->
    <link th:href="@{/css/pos-style.css}" rel="stylesheet">
    
    <!-- PWA Settings -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#16213e">
    <link rel="apple-touch-icon" href="/images/icon-192.png">
</head>
<body>
    <div th:fragment="sidebar">
        <style>
            .sidebar .nav-link {
                color: #a0a0b0 !important;
                display: block;
                padding: 15px 25px;
                text-decoration: none;
                font-size: 16px;
                transition: 0.3s;
            }
            .sidebar .nav-link:hover, .sidebar .nav-link.active {
                color: #ffffff !important;
                background-color: rgba(255, 255, 255, 0.1) !important;
                border-left: 4px solid var(--accent-primary);
            }
        </style>
        <div class="sidebar" id="sidebar">
            <div class="brand" style="text-align: center; margin-bottom: 25px; padding: 0 15px;">
                <div class="sidebar-trishul" style="font-size: 26px; margin-bottom: -5px; color: #e5c158 !important; text-shadow: 1px 2px 3px rgba(0, 0, 0, 0.9); display: inline-block; animation: sidebarTrishulSpin 6s linear infinite;">🔱</div>
                <div style="font-family: 'Noto Serif Devanagari', serif; font-weight: 700; font-size: 24px; letter-spacing: 0.5px; margin-bottom: 2px; color: #e5c158 !important; text-shadow: 1px 2px 2px rgba(0, 0, 0, 0.9);">अर्बन काशी</div>
                <div style="font-family: 'Segoe UI', sans-serif; font-weight: 600; font-size: 10px; letter-spacing: 2px; color: #e5c158 !important; text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8); opacity: 0.95;">URBAN KASHI</div>
            </div>
            <a th:href="@{/}" class="nav-link" data-path="/">
                <i class="bi bi-graph-up-arrow"></i> Dashboard
            </a>
            <a th:href="@{/pos}" class="nav-link" data-path="/pos">
                <i class="bi bi-cart3"></i> Billing / POS
            </a>
            <a th:href="@{/inventory}" class="nav-link" data-path="/inventory">
                <i class="bi bi-box-seam"></i> Inventory
            </a>
            <a th:href="@{/customers}" class="nav-link" data-path="/customers">
                <i class="bi bi-people"></i> Customers
            </a>
        </div>
        <button class="hamburger-menu" id="hamburgerMenu" style="position: fixed; top: 15px; left: 15px; z-index: 1050;">
            <i class="bi bi-list"></i>
        </button>
        <script>
            document.addEventListener('DOMContentLoaded', function() {
                var path = window.location.pathname;
                document.querySelectorAll('.sidebar .nav-link').forEach(function(link) {
                    var linkPath = link.getAttribute('data-path');
                    if (path === linkPath || (linkPath !== '/' && path.startsWith(linkPath))) {
                        link.classList.add('active');
                    }
                });
            });

            // Register PWA Service Worker
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', function() {
                    navigator.serviceWorker.register('/sw.js').then(function(registration) {
                        console.log('ServiceWorker registration successful');
                    }, function(err) {
                        console.log('ServiceWorker registration failed: ', err);
                    });
                });
            }
        </script>
    </div>
</body>
</html>
