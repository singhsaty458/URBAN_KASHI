<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title>Urban Kashi POS</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom POS Style -->
    <link th:href="@{/css/pos-style.css}" rel="stylesheet">
    
    <!-- PWA Settings -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#16213e">
    <link rel="apple-touch-icon" href="/images/icon-192.png">
</head>
<body>
    <div th:fragment="sidebar">
        <style>
            .sidebar .nav-link {
                color: #a0a0b0 !important;
                display: block;
                padding: 15px 25px;
                text-decoration: none;
                font-size: 16px;
                transition: 0.3s;
            }
            .sidebar .nav-link:hover, .sidebar .nav-link.active {
                color: #ffffff !important;
                background-color: rgba(255, 255, 255, 0.1) !important;
                border-left: 4px solid var(--accent-primary);
            }
        </style>
        <div class="sidebar" id="sidebar">
            <div class="brand" style="text-align: center; margin-bottom: 25px; padding: 0 15px;">
                <div class="sidebar-trishul" style="font-size: 26px; margin-bottom: -5px; color: #e5c158 !important; text-shadow: 1px 2px 3px rgba(0, 0, 0, 0.9); display: inline-block; animation: sidebarTrishulSpin 6s linear infinite;">🔱</div>
                <div style="font-family: 'Noto Serif Devanagari', serif; font-weight: 700; font-size: 24px; letter-spacing: 0.5px; margin-bottom: 2px; color: #e5c158 !important; text-shadow: 1px 2px 2px rgba(0, 0, 0, 0.9);">अर्बन काशी</div>
                <div style="font-family: 'Segoe UI', sans-serif; font-weight: 600; font-size: 10px; letter-spacing: 2px; color: #e5c158 !important; text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8); opacity: 0.95;">URBAN KASHI</div>
            </div>
            <a th:href="@{/}" class="nav-link" data-path="/">
                <i class="bi bi-graph-up-arrow"></i> Dashboard
            </a>
            <a th:href="@{/pos}" class="nav-link" data-path="/pos">
                <i class="bi bi-cart3"></i> Billing / POS
            </a>
            <a th:href="@{/inventory}" class="nav-link" data-path="/inventory">
                <i class="bi bi-box-seam"></i> Inventory
            </a>
            <a th:href="@{/customers}" class="nav-link" data-path="/customers">
                <i class="bi bi-people"></i> Customers
            </a>
            <a th:href="@{/returns}" class="nav-link" data-path="/returns">
                <i class="bi bi-arrow-return-left"></i> Returns / Refunds
            </a>
            <a th:href="@{/stock-history}" class="nav-link" data-path="/stock-history">
                <i class="bi bi-clock-history"></i> Stock History
            </a>
            <a th:href="@{/audit-logs}" class="nav-link" data-path="/audit-logs">
                <i class="bi bi-shield-check"></i> Audit Logs
            </a>
            <a th:href="@{/apparel-reports}" class="nav-link" data-path="/apparel-reports">
                <i class="bi bi-bar-chart"></i> Apparel Reports
            </a>
        </div>
        <button class="hamburger-menu" id="hamburgerMenu" style="position: fixed; top: 15px; left: 15px; z-index: 1050;">
            <i class="bi bi-list"></i>
        </button>
        <script>
            document.addEventListener('DOMContentLoaded', function() {
                var path = window.location.pathname;
                document.querySelectorAll('.sidebar .nav-link').forEach(function(link) {
                    var linkPath = link.getAttribute('data-path');
                    if (path === linkPath || (linkPath !== '/' && path.startsWith(linkPath))) {
                        link.classList.add('active');
                    }
                });
            });

            // Register PWA Service Worker
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', function() {
                    navigator.serviceWorker.register('/sw.js').then(function(registration) {
                        console.log('ServiceWorker registration successful');
                    }, function(err) {
                        console.log('ServiceWorker registration failed: ', err);
                    });
                });
            }

            // Spring Security CSRF token for existing HTML forms.
            document.addEventListener('DOMContentLoaded', function() {
                var tokenMeta = document.querySelector('meta[name="_csrf"]');
                if (!tokenMeta) return;
                document.querySelectorAll('form[method="post"], form:not([method])').forEach(function(form) {
                    if (form.querySelector('input[name="_csrf"]')) return;
                    var input = document.createElement('input');
                    input.type = 'hidden'; input.name = '_csrf'; input.value = tokenMeta.content;
                    form.appendChild(input);
                });
            });
        </script>
        <header class="shared-page-header">
            <h2 th:text="${sectionName}">Dashboard</h2>
            <p class="header-slogan">सर्वे भवन्तु सुखिनः</p>
        </header>
        <details class="global-user-menu">
            <summary class="global-user-chip" aria-label="Open user menu">
                <span th:text="${#strings.toUpperCase(#strings.substring(currentUser, 0, 1))}">U</span>
                <strong th:text="${currentUser}">admin</strong>
                <i class="bi bi-chevron-down"></i>
            </summary>
            <div class="global-user-dropdown">
                <a href="/account"><i class="bi bi-person"></i> Account</a>
                <div class="dropdown-divider"></div>
                <form th:action="@{/logout}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit"><i class="bi bi-box-arrow-right"></i> Logout</button>
                </form>
            </div>
        </details>
    </div>
</body>
</html>
