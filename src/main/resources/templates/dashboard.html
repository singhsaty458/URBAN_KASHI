<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head}"></head>
<body>
    <div th:replace="~{fragments/header :: sidebar}"></div>
    
    <div class="main-content">
        <h2 class="mb-4">Dashboard</h2>
        
        <div class="row">
            <div class="col-md-3">
                <div class="dashboard-card bg-gradient-green">
                    <h5>Today's Revenue</h5>
                    <h3 th:text="${'₹' + #numbers.formatDecimal(dashboard.todayRevenue, 1, 'COMMA', 2, 'POINT')}">₹0.00</h3>
                </div>
            </div>
            <div class="col-md-3">
                <div class="dashboard-card bg-gradient-blue">
                    <h5>Today's Transactions</h5>
                    <h3 th:text="${dashboard.todayTransactions}">0</h3>
                </div>
            </div>
            <div class="col-md-3">
                <div class="dashboard-card bg-gradient-purple">
                    <h5>Month's Revenue</h5>
                    <h3 th:text="${'₹' + #numbers.formatDecimal(dashboard.monthRevenue, 1, 'COMMA', 2, 'POINT')}">₹0.00</h3>
                </div>
            </div>
            <div class="col-md-3">
                <div class="dashboard-card bg-gradient-red">
                    <h5>Total Customers</h5>
                    <h3 th:text="${dashboard.totalCustomers}">0</h3>
                </div>
            </div>
        </div>
        
        <div class="row mt-4">
            <div class="col-md-8">
                <div class="card bg-dark text-white border-secondary h-100">
                    <div class="card-header border-secondary">
                        <h5 class="mb-0">Recent Invoices</h5>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-dark table-striped mb-0">
                                <thead>
                                    <tr>
                                        <th>Invoice #</th>
                                        <th>Customer</th>
                                        <th>Amount</th>
                                        <th>Mode</th>
                                        <th>Date</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="inv : ${dashboard.recentInvoices}">
                                        <td th:text="${inv.invoiceNumber}">INV-001</td>
                                        <td th:text="${inv.customer != null ? inv.customer.fullName : 'Walk-in'}">John Doe</td>
                                        <td th:text="${'₹' + #numbers.formatDecimal(inv.grandTotal, 1, 'COMMA', 2, 'POINT')}">₹1000.00</td>
                                        <td>
                                            <span class="badge" 
                                                  th:classappend="${inv.paymentMode == 'CASH' ? 'bg-success' : (inv.paymentMode == 'UPI' ? 'bg-info' : 'bg-primary')}"
                                                  th:text="${inv.paymentMode}">CASH</span>
                                        </td>
                                        <td th:text="${#temporals.format(inv.createdAt, 'dd MMM yy HH:mm')}">12 Jan 24 14:30</td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(dashboard.recentInvoices)}">
                                        <td colspan="5" class="text-center py-3">No recent invoices</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="col-md-4 mt-4 mt-md-0">
                <div class="card bg-dark text-white border-secondary h-100">
                    <div class="card-header border-secondary d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">Low Stock Alerts</h5>
                        <span class="badge bg-danger rounded-pill" th:text="${dashboard.lowStockCount}">0</span>
                    </div>
                    <div class="card-body p-0">
                        <ul class="list-group list-group-flush list-group-dark bg-dark">
                            <li class="list-group-item bg-dark text-white border-secondary d-flex justify-content-between align-items-center" th:each="item : ${dashboard.lowStockItems}">
                                <div>
                                    <strong th:text="${item.product.name}">Product</strong>
                                    <br>
                                    <small class="text-muted" th:text="${item.size + ' - ' + item.color}">S - Red</small>
                                </div>
                                <span class="badge bg-danger rounded-pill" th:text="${item.stockQuantity}">2</span>
                            </li>
                            <li class="list-group-item bg-dark text-white border-secondary text-center py-3" th:if="${#lists.isEmpty(dashboard.lowStockItems)}">
                                No low stock items
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
