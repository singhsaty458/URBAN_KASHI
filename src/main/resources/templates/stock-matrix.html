<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/header :: head}"></head><body><div th:replace="~{fragments/header :: sidebar}"></div><main class="main-content matrix-page"><div class="section-toolbar"><div><p class="section-kicker">SIZE × COLOR MATRIX</p><h2 th:text="${product.name}">Product</h2><p class="section-description">Live inventory availability across every apparel combination.</p></div><a class="btn btn-outline-primary" href="/inventory">Back to inventory</a></div><section class="matrix-card"><div class="table-responsive"><table class="stock-matrix-table"><thead><tr><th>Color</th><th th:each="size:${sizes}" th:text="${size}">M</th></tr></thead><tbody><tr th:each="row:${matrix}"><th th:text="${row.key}">Blue</th><td th:each="size:${sizes}"><div th:with="variant=${row.value.get(size)}" class="matrix-cell" th:classappend="${variant == null ? ' missing' : (variant.stockQuantity == 0 ? ' out' : (variant.stockQuantity <= 5 ? ' low' : ' in'))}"><strong th:text="${variant == null ? '—' : variant.stockQuantity}">0</strong><small th:if="${variant != null}" th:text="${variant.sku ?: variant.barcode}">SKU</small></div></td></tr></tbody></table></div></section></main><div th:replace="~{fragments/footer :: scripts}"></div></body></html>
