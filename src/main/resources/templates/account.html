<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head}"></head>
<body>
<div th:replace="~{fragments/header :: sidebar}"></div>
<main class="main-content account-page">
    <div class="account-card">
        <div class="account-avatar" th:text="${#strings.toUpperCase(#strings.substring(username, 0, 1))}">A</div>
        <span class="eyebrow">ACCOUNT</span>
        <h1 th:text="${username}">admin</h1>
        <p>Your Urban Kashi POS profile</p>
        <div class="role-list"><span th:each="role : ${roles}" th:text="${#strings.replace(role.authority, 'ROLE_', '')}">ADMIN</span></div>
        <a class="back-dashboard" href="/">← Back to dashboard</a>
    </div>
</main>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
