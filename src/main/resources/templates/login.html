<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in · Urban Kashi POS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/pos-style.css}" rel="stylesheet">
</head>
<body class="login-page">
    <main class="login-card">
        <div class="login-brand"><span>🔱</span><strong>अर्बन काशी</strong><small>SMART POS SYSTEM</small></div>
        <h1>Welcome back</h1><p class="login-subtitle">Sign in to continue to your workspace.</p>
        <div th:if="${param.error}" class="login-alert">Invalid username or password.</div>
        <div th:if="${param.logout}" class="login-success">You have been signed out safely.</div>
        <form th:action="@{/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <label for="username">Username</label><input id="username" name="username" type="text" autocomplete="username" required autofocus>
            <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required>
            <button type="submit">Sign in <i class="bi bi-arrow-right"></i></button>
        </form>
        <small class="login-note">Ask your administrator for access credentials.</small>
    </main>
</body>
</html>
