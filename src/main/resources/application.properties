server.port=8080
server.address=0.0.0.0
spring.application.name=Urban Kashi POS

# Database Configuration (Falls back to local H2 if environment variables are not set)
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/urbankashi_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.defer-datasource-initialization=true

# Cloudinary Configuration
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api_key=${CLOUDINARY_API_KEY:}
cloudinary.api_secret=${CLOUDINARY_API_SECRET:}

# Thymeleaf
spring.thymeleaf.cache=false

# Init mode
spring.sql.init.mode=${DB_INIT_MODE:always}

# Security: override both passwords through environment variables outside local development.
app.security.admin-username=${ADMIN_USERNAME:admin}
app.security.admin-password=${ADMIN_PASSWORD:admin123}
app.security.cashier-username=${CASHIER_USERNAME:cashier}
app.security.cashier-password=${CASHIER_PASSWORD:cashier123}

# Flyway is enabled in the production profile; local H2 keeps the existing seed workflow.
spring.flyway.enabled=${FLYWAY_ENABLED:false}

# Monitoring: only health information is public; all other actuator endpoints stay protected.
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=true
info.app.name=Urban Kashi POS
info.app.version=1.0.0
