server.port=8080
server.address=0.0.0.0
spring.application.name=Urban Kashi POS

# Database Configuration (Falls back to local H2 if environment variables are not set)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/urban_kashi}
spring.datasource.driverClassName=${DB_DRIVER:org.postgresql.Driver}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin123}
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.defer-datasource-initialization=true

# Cloudinary Configuration
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api_key=${CLOUDINARY_API_KEY:}
cloudinary.api_secret=${CLOUDINARY_API_SECRET:}

# Thymeleaf
spring.thymeleaf.cache=false

# Init mode
spring.sql.init.mode=${DB_INIT_MODE:always}

# Security: override both passwords through environment variables outside local development.
app.security.admin-username=${ADMIN_USERNAME:admin}
app.security.admin-password=${ADMIN_PASSWORD:admin123}
app.security.cashier-username=${CASHIER_USERNAME:cashier}
app.security.cashier-password=${CASHIER_PASSWORD:cashier123}

# Flyway is enabled in the production profile; local H2 keeps the existing seed workflow.
spring.flyway.enabled=${FLYWAY_ENABLED:false}

# Monitoring: only health information is public; all other actuator endpoints stay protected.
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=true
info.app.name=Urban Kashi POS
info.app.version=1.0.0

# WhatsApp Business Cloud API (set secure environment variables in production).
app.whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
app.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
app.whatsapp.graph-version=${WHATSAPP_GRAPH_VERSION:v22.0}
# Approved WhatsApp template with a DOCUMENT header, required for proactive receipt delivery.
app.whatsapp.receipt-template=${WHATSAPP_RECEIPT_TEMPLATE:}
app.whatsapp.template-language=${WHATSAPP_TEMPLATE_LANGUAGE:en_US}

# Automated encrypted backup. Keep all secrets outside Git/source control.
app.backup.enabled=${BACKUP_ENABLED:true}
app.backup.directory=${APP_BACKUP_DIRECTORY:./data/backups}
app.backup.encryption-key=${BACKUP_ENCRYPTION_KEY:}
app.backup.google-service-account-key=${GOOGLE_DRIVE_SERVICE_ACCOUNT_KEY_PATH:}
app.backup.google-folder-id=${GOOGLE_DRIVE_FOLDER_ID:}
app.backup.pg-dump-path=${PG_DUMP_PATH:pg_dump}



