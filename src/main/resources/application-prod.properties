spring.config.activate.on-profile=prod

# Production PostgreSQL configuration. Set DB_URL, DB_USERNAME and DB_PASSWORD securely.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/urbankashi}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.h2.console.enabled=false
app.security.admin-password=${ADMIN_PASSWORD}
app.security.cashier-password=${CASHIER_PASSWORD}